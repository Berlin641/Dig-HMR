          <img src="assets/method-overview.png" width="1920" height="1080" loading="lazy" alt="DIG-HMR framework: shared person feature extraction and ROI Align, a Dual-View Person Interaction Module, and a Global-Query World-Space Fusion Decoder with learnable global queries and initial world references.">
        </button>
        <figcaption id="method-caption">Overview of the proposed DIG-HMR framework. Given dual-view synchronized frames, person-centric ROI features are extracted independently from each view. DVPIM enhances the two view-specific person representations. The resulting branch memories are subsequently read by learnable global-query tokens in the GWF. GWF produces a unified set of MHR bodies in the common world coordinate system.</figcaption>
